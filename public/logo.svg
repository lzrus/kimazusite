<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <!-- Brand Emblem with Roadway Motif -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield Background in vibrant gradient -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#roadwayGrad)" />
    <rect x="2" y="2" width="96" height="96" rx="20" stroke="white" stroke-opacity="0.3" stroke-width="2" fill="none" />
    
    <!-- Stylized K with roadway perspective curve -->
    <path d="M34 24 V76" stroke="white" stroke-width="9" stroke-linecap="round" />
    <path d="M68 28 L45 50 L68 74" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Roadway perspective arc at bottom -->
    <path d="M20 84 C 36 78, 64 78, 80 84" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" />
    <!-- Roadway dashed markings -->
    <line x1="42" y1="80" x2="48" y2="80" stroke="white" stroke-width="2" stroke-linecap="round" />
    <line x1="52" y1="80" x2="58" y2="80" stroke="white" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: KIMAZU Transport -->
  <g transform="translate(130, 24)">
    <text x="0" y="46" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1">
      KIMAZU
    </text>
    <text x="195" y="46" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="800" font-size="44" fill="#F97316" letter-spacing="-1">
      Transport
    </text>
    <!-- Subtitle: Roadway / Mobilité & Gestion de Taxis -->
    <text x="2" y="72" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="2.8">
      ROADWAY · MOBILITÉ &amp; GESTION DE TAXIS · POINTE-NOIRE
    </text>
  </g>

  <defs>
    <linearGradient id="roadwayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>
</svg>
